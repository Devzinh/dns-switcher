<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Pipeline: detecta adaptador, mede latência UDP/53, escolhe o mais rápido, aplica via netsh, limpa cache">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" x2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="0.5" stop-color="#0ea5e9"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, monospace; }
      .card { opacity: 0; animation: pop .6s cubic-bezier(.2,.9,.3,1.3) forwards; transform-box: fill-box; transform-origin: center; }
      .c1 { animation-delay: .1s } .c2 { animation-delay: .35s } .c3 { animation-delay: .6s } .c4 { animation-delay: .85s } .c5 { animation-delay: 1.1s }
      @keyframes pop { from { opacity: 0; transform: scale(.85) } to { opacity: 1; transform: none } }
      .flow { stroke-dasharray: 10 10; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20 } }
      .pkt { offset-path: path('M130 160 H 1070'); animation: run 5s ease-in-out infinite; }
      @keyframes run { 0% { offset-distance: 0%; opacity: 0 } 5% { opacity: 1 } 95% { opacity: 1 } 100% { offset-distance: 100%; opacity: 0 } }
      .hl { animation: hl 5s ease-in-out infinite; opacity: 0; }
      .h1 { animation-delay: 0s } .h2 { animation-delay: 1s } .h3 { animation-delay: 2s } .h4 { animation-delay: 3s } .h5 { animation-delay: 4s }
      @keyframes hl { 0%,25%,100% { opacity: 0 } 5%,15% { opacity: 1 } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <text class="t" x="40" y="48" font-size="22" font-weight="700" fill="#e2e8f0">Como funciona</text>
  <text class="t" x="40" y="74" font-size="14" fill="#64748b">Do clique ao resolvedor novo — sem reiniciar, sem mexer em configuração de rede na mão.</text>

  <path d="M130 160 H 1070" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <path class="flow" d="M130 160 H 1070" stroke="url(#wire)" stroke-width="2.5" fill="none"/>

  <!-- five stages, centers at 130, 365, 600, 835, 1070 -->
  <g class="t">
    <g class="card c1">
      <rect class="hl h1" x="50" y="104" width="160" height="152" rx="14" fill="none" stroke="#5eead4" stroke-width="2"/>
      <rect x="55" y="109" width="150" height="142" rx="12" fill="#0b1220" stroke="#1e3a5f"/>
      <text x="130" y="140" text-anchor="middle" font-size="26">🔌</text>
      <text x="130" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">1 · Adaptador</text>
      <text class="m" x="130" y="202" text-anchor="middle" font-size="11" fill="#94a3b8">netsh interface</text>
      <text class="m" x="130" y="218" text-anchor="middle" font-size="11" fill="#94a3b8">ipv4 show interfaces</text>
    </g>
    <g class="card c2">
      <rect class="hl h2" x="285" y="104" width="160" height="152" rx="14" fill="none" stroke="#5eead4" stroke-width="2"/>
      <rect x="290" y="109" width="150" height="142" rx="12" fill="#0b1220" stroke="#1e3a5f"/>
      <text x="365" y="140" text-anchor="middle" font-size="26">📡</text>
      <text x="365" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">2 · Sonda UDP</text>
      <text class="m" x="365" y="202" text-anchor="middle" font-size="11" fill="#94a3b8">query A cru (RFC 1035)</text>
      <text class="m" x="365" y="218" text-anchor="middle" font-size="11" fill="#94a3b8">→ :53 · timeout 500ms</text>
    </g>
    <g class="card c3">
      <rect class="hl h3" x="520" y="104" width="160" height="152" rx="14" fill="none" stroke="#5eead4" stroke-width="2"/>
      <rect x="525" y="109" width="150" height="142" rx="12" fill="#0b1220" stroke="#1e3a5f"/>
      <text x="600" y="140" text-anchor="middle" font-size="26">🏁</text>
      <text x="600" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">3 · Menor RTT</text>
      <text class="m" x="600" y="202" text-anchor="middle" font-size="11" fill="#94a3b8">min(round-trip)</text>
      <text class="m" x="600" y="218" text-anchor="middle" font-size="11" fill="#94a3b8">auto-seleciona</text>
    </g>
    <g class="card c4">
      <rect class="hl h4" x="755" y="104" width="160" height="152" rx="14" fill="none" stroke="#5eead4" stroke-width="2"/>
      <rect x="760" y="109" width="150" height="142" rx="12" fill="#0b1220" stroke="#1e3a5f"/>
      <text x="835" y="140" text-anchor="middle" font-size="26">⚙️</text>
      <text x="835" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">4 · Aplica</text>
      <text class="m" x="835" y="202" text-anchor="middle" font-size="11" fill="#94a3b8">set dnsservers static</text>
      <text class="m" x="835" y="218" text-anchor="middle" font-size="11" fill="#94a3b8">add dnsservers index=2</text>
    </g>
    <g class="card c5">
      <rect class="hl h5" x="990" y="104" width="160" height="152" rx="14" fill="none" stroke="#5eead4" stroke-width="2"/>
      <rect x="995" y="109" width="150" height="142" rx="12" fill="#0b1220" stroke="#1e3a5f"/>
      <text x="1070" y="140" text-anchor="middle" font-size="26">🧹</text>
      <text x="1070" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">5 · Flush</text>
      <text class="m" x="1070" y="202" text-anchor="middle" font-size="11" fill="#94a3b8">ipconfig /flushdns</text>
      <text class="m" x="1070" y="218" text-anchor="middle" font-size="11" fill="#94a3b8">cache limpo ✓</text>
    </g>
  </g>
  <circle class="pkt" r="6" fill="#5eead4"/>
</svg>
