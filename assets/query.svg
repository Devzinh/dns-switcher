<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Consulta DNS em hexadecimal enviada pelo DNS Switcher e o tempo de resposta de cada resolvedor; Cloudflare responde primeiro, em 9 ms, e é selecionado">
  <defs>
    <style>
      svg { --fg: #1f2328; --muted: #59636e; --rule: #d1d9e0; --ok: #1a7f37; --bar: #d1d9e0; }
      @media (prefers-color-scheme: dark) {
        svg { --fg: #f0f6fc; --muted: #9198a1; --rule: #3d444d; --ok: #3fb950; --bar: #3d444d; }
      }
      text { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: var(--fg); }
      .muted { fill: var(--muted); }
      .ok { fill: var(--ok); }
      .rule { stroke: var(--rule); stroke-width: 1; }
      .bar { fill: var(--bar); }
      .bar.win { fill: var(--ok); }
      .small { font-size: 12.5px; }

      .clip { transform-box: fill-box; transform-origin: left center; }
      .p1 { animation: p1 12s infinite; }
      .p2 { animation: p2 12s infinite; }
      .p3 { animation: p3 12s infinite; }
      @keyframes p1 { 0% { transform: scaleX(0); animation-timing-function: steps(12, end) } 7% { transform: scaleX(1) } 95% { transform: scaleX(1); } 100% { transform: scaleX(0) } }
      @keyframes p2 { 0%, 7.5% { transform: scaleX(0); animation-timing-function: steps(16, end) } 16% { transform: scaleX(1) } 95% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
      @keyframes p3 { 0%, 16.5% { transform: scaleX(0); animation-timing-function: steps(4, end) } 19% { transform: scaleX(1) } 95% { transform: scaleX(1) } 100% { transform: scaleX(0) } }

      .note { animation: note 12s infinite; }
      @keyframes note { 0%, 20% { opacity: 0 } 23%, 95% { opacity: 1 } 100% { opacity: 0 } }

      .r1 { animation: r1 12s infinite; } .r2 { animation: r2 12s infinite; } .r3 { animation: r3 12s infinite; }
      .r4 { animation: r4 12s infinite; } .r5 { animation: r5 12s infinite; }
      @keyframes r1 { 0%, 26% { opacity: 0 } 27%, 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r2 { 0%, 32% { opacity: 0 } 33%, 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r3 { 0%, 38% { opacity: 0 } 39%, 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r4 { 0%, 44% { opacity: 0 } 45%, 95% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes r5 { 0%, 51% { opacity: 0 } 52%, 95% { opacity: 1 } 100% { opacity: 0 } }

      .g { transform-box: fill-box; transform-origin: left center; }
      .g1 { animation: g1 12s infinite; } .g2 { animation: g2 12s infinite; } .g3 { animation: g3 12s infinite; } .g4 { animation: g4 12s infinite; }
      @keyframes g1 { 0%, 26% { transform: scaleX(0); animation-timing-function: ease-out } 30%, 95% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
      @keyframes g2 { 0%, 32% { transform: scaleX(0); animation-timing-function: ease-out } 36%, 95% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
      @keyframes g3 { 0%, 38% { transform: scaleX(0); animation-timing-function: ease-out } 42%, 95% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
      @keyframes g4 { 0%, 44% { transform: scaleX(0); animation-timing-function: ease-out } 48%, 95% { transform: scaleX(1) } 100% { transform: scaleX(0) } }

      .win-text { animation: win 12s infinite; }
      @keyframes win { 0%, 57% { fill: var(--fg) } 59%, 95% { fill: var(--ok) } 100% { fill: var(--fg) } }
      .sel { animation: sel 12s infinite; }
      @keyframes sel { 0%, 57% { opacity: 0 } 59%, 95% { opacity: 1 } 100% { opacity: 0 } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .win-text { fill: var(--ok); }
      }
    </style>
    <clipPath id="c1"><rect class="clip p1" x="20" y="20" width="310" height="26"/></clipPath>
    <clipPath id="c2"><rect class="clip p2" x="20" y="48" width="410" height="26"/></clipPath>
    <clipPath id="c3"><rect class="clip p3" x="20" y="76" width="110" height="26"/></clipPath>
  </defs>

  <!-- the query, byte for byte -->
  <text x="24" y="38" clip-path="url(#c1)" xml:space="preserve">12 34 01 00 00 01 00 00 00 00 00 00</text>
  <text x="24" y="66" clip-path="url(#c2)" xml:space="preserve">03 77 77 77 06 67 6f 6f 67 6c 65 03 63 6f 6d 00</text>
  <text x="24" y="94" clip-path="url(#c3)" xml:space="preserve">00 01 00 01</text>

  <text class="muted" x="470" y="38">cabeçalho: id 0x1234, recursão, 1 pergunta</text>
  <text class="muted" x="470" y="66">nome: www.google.com</text>
  <text class="muted" x="470" y="94">tipo A, classe IN</text>

  <text class="muted note small" x="24" y="128">Enviado por UDP à porta 53 de cada resolvedor. A primeira resposta para o relógio.</text>

  <line class="rule" x1="24" y1="150" x2="856" y2="150"/>

  <!-- replies -->
  <g class="r1">
    <text class="win-text" x="24" y="186">1.1.1.1</text>
    <text class="win-text" x="184" y="186">Cloudflare</text>
    <text class="win-text" x="380" y="186" text-anchor="end">9 ms</text>
  </g>
  <rect class="bar win g g1" x="400" y="176" width="90" height="12"/>
  <text class="ok sel" x="510" y="186">selecionado</text>

  <g class="r2">
    <text x="24" y="216">8.8.8.8</text>
    <text x="184" y="216">Google</text>
    <text x="380" y="216" text-anchor="end">14 ms</text>
  </g>
  <rect class="bar g g2" x="400" y="206" width="140" height="12"/>

  <g class="r3">
    <text x="24" y="246">9.9.9.9</text>
    <text x="184" y="246">Quad9</text>
    <text x="380" y="246" text-anchor="end">18 ms</text>
  </g>
  <rect class="bar g g3" x="400" y="236" width="180" height="12"/>

  <g class="r4">
    <text x="24" y="276">94.140.14.14</text>
    <text x="184" y="276">AdGuard</text>
    <text x="380" y="276" text-anchor="end">27 ms</text>
  </g>
  <rect class="bar g g4" x="400" y="266" width="270" height="12"/>

  <g class="r5">
    <text class="muted" x="24" y="306">77.88.8.1</text>
    <text class="muted" x="184" y="306">Yandex</text>
    <text class="muted" x="380" y="306" text-anchor="end">263 ms</text>
    <text class="muted" x="400" y="306">servidor mais próximo fica na Europa</text>
  </g>

  <text class="muted small" x="24" y="344">Exemplo de execução. Os tempos reais dependem do seu provedor e da sua região.</text>
</svg>
