<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="DNS Switcher — switch DNS in one click">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .t   { font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif; }
      .m   { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
      .fade { opacity: 0; animation: in 0.9s ease-out forwards; }
      .d1 { animation-delay: .2s } .d2 { animation-delay: .5s } .d3 { animation-delay: .8s }
      @keyframes in { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      .ring { transform-origin: 900px 200px; animation: ring 3s ease-out infinite; }
      .ring.b { animation-delay: 1s } .ring.c { animation-delay: 2s }
      @keyframes ring { from { transform: scale(.3); opacity: .8 } to { transform: scale(1.6); opacity: 0 } }
      .pkt { offset-rotate: 0deg; animation: fly 2.4s cubic-bezier(.5,0,.5,1) infinite; }
      .p2 { animation-delay: .6s } .p3 { animation-delay: 1.2s } .p4 { animation-delay: 1.8s }
      @keyframes fly { 0% { offset-distance: 0%; opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { offset-distance: 100%; opacity: 0 } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .scan { animation: scan 4s linear infinite; }
      @keyframes scan { from { transform: translateX(-1200px) } to { transform: translateX(1200px) } }
      .ms { animation: tick 2.4s ease-in-out infinite; }
      @keyframes tick { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)" opacity=".55"/>
  <rect class="scan" x="0" y="0" width="160" height="400" fill="#38bdf8" opacity=".04"/>

  <!-- left: text -->
  <g class="t">
    <text class="fade" x="70" y="150" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1.5">DNS Switcher</text>
    <text class="fade d1" x="72" y="198" font-size="22" fill="#cbd5e1">Troque seu DNS em um clique. Mais rápido, mais privado.</text>
    <g class="fade d2">
      <text class="m" x="72" y="250" font-size="16" fill="#64748b">&gt;</text>
      <text class="m" x="90" y="250" font-size="16" fill="#e2e8f0">A? www.google.com @1.1.1.1 <tspan fill="#5eead4">9 ms ✓</tspan></text>
      <rect class="blink" x="430" y="236" width="9" height="18" fill="#5eead4"/>
    </g>
    <g class="fade d3 m" font-size="13">
      <rect x="72" y="282" width="92" height="28" rx="14" fill="#0f2a2e" stroke="#14b8a6"/>
      <text x="118" y="301" text-anchor="middle" fill="#5eead4">Rust</text>
      <rect x="174" y="282" width="92" height="28" rx="14" fill="#0c2236" stroke="#0ea5e9"/>
      <text x="220" y="301" text-anchor="middle" fill="#7dd3fc">egui</text>
      <rect x="276" y="282" width="112" height="28" rx="14" fill="#1c1836" stroke="#8b5cf6"/>
      <text x="332" y="301" text-anchor="middle" fill="#c4b5fd">Windows</text>
      <rect x="398" y="282" width="112" height="28" rx="14" fill="#1f1a10" stroke="#f59e0b"/>
      <text x="454" y="301" text-anchor="middle" fill="#fcd34d">MIT</text>
    </g>
  </g>

  <!-- right: client -> resolvers -->
  <circle cx="900" cy="200" r="150" fill="url(#glow)"/>
  <circle class="ring"   cx="900" cy="200" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle class="ring b" cx="900" cy="200" r="70" fill="none" stroke="#5eead4" stroke-width="1.5"/>
  <circle class="ring c" cx="900" cy="200" r="70" fill="none" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- client node -->
  <g>
    <rect x="862" y="172" width="76" height="56" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <rect x="874" y="182" width="52" height="30" rx="4" fill="#0f1c33"/>
    <text class="m" x="900" y="202" font-size="12" text-anchor="middle" fill="#5eead4">:53</text>
    <rect x="886" y="228" width="28" height="6" rx="2" fill="#38bdf8"/>
  </g>

  <!-- resolver paths -->
  <g fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4 6">
    <path id="r1" d="M900 200 C 980 120, 1040 90, 1110 80"/>
    <path id="r2" d="M900 200 C 990 190, 1050 180, 1120 170"/>
    <path id="r3" d="M900 200 C 990 250, 1040 280, 1110 300"/>
    <path id="r4" d="M900 200 C 820 300, 760 330, 700 340"/>
  </g>

  <g class="m" font-size="12">
    <g><circle cx="1110" cy="80" r="7" fill="#f97316"/><text x="1090" y="60" fill="#fdba74" text-anchor="middle">1.1.1.1</text><text class="ms" x="1150" y="84" fill="#5eead4" text-anchor="middle">9ms</text></g>
    <g><circle cx="1120" cy="170" r="7" fill="#22c55e"/><text x="1120" y="150" fill="#86efac" text-anchor="middle">8.8.8.8</text><text class="ms" x="1160" y="174" fill="#5eead4" text-anchor="middle">14ms</text></g>
    <g><circle cx="1110" cy="300" r="7" fill="#a78bfa"/><text x="1110" y="328" fill="#c4b5fd" text-anchor="middle">9.9.9.9</text><text class="ms" x="1150" y="304" fill="#5eead4" text-anchor="middle">18ms</text></g>
    <g><circle cx="700" cy="340" r="7" fill="#38bdf8"/><text x="700" y="368" fill="#7dd3fc" text-anchor="middle">94.140.14.14</text><text class="ms" x="660" y="344" fill="#5eead4" text-anchor="middle">27ms</text></g>
  </g>

  <!-- packets travelling along the paths -->
  <g filter="url(#soft)">
    <circle class="pkt"    r="5" fill="#5eead4" style="offset-path: path('M900 200 C 980 120, 1040 90, 1110 80')"/>
    <circle class="pkt p2" r="5" fill="#38bdf8" style="offset-path: path('M900 200 C 990 190, 1050 180, 1120 170')"/>
    <circle class="pkt p3" r="5" fill="#a78bfa" style="offset-path: path('M900 200 C 990 250, 1040 280, 1110 300')"/>
    <circle class="pkt p4" r="5" fill="#5eead4" style="offset-path: path('M900 200 C 820 300, 760 330, 700 340')"/>
  </g>
  <g>
    <circle class="pkt"    r="2.5" fill="#ecfeff" style="offset-path: path('M900 200 C 980 120, 1040 90, 1110 80')"/>
    <circle class="pkt p2" r="2.5" fill="#ecfeff" style="offset-path: path('M900 200 C 990 190, 1050 180, 1120 170')"/>
    <circle class="pkt p3" r="2.5" fill="#ecfeff" style="offset-path: path('M900 200 C 990 250, 1040 280, 1110 300')"/>
    <circle class="pkt p4" r="2.5" fill="#ecfeff" style="offset-path: path('M900 200 C 820 300, 760 330, 700 340')"/>
  </g>
</svg>
