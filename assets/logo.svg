<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="DNS Switcher">
  <style>
    svg { --fg: #1f2328; --muted: #d1d9e0; --ok: #1a7f37; }
    @media (prefers-color-scheme: dark) { svg { --fg: #f0f6fc; --muted: #3d444d; --ok: #3fb950; } }
    .line { fill: none; stroke-width: 10; stroke-linecap: round; }
  </style>
  <path class="line" style="stroke: var(--muted)" d="M70 80 C 96 80, 100 116, 113 116"/>
  <circle cx="128" cy="116" r="11" fill="none" style="stroke: var(--muted)" stroke-width="8"/>
  <path class="line" style="stroke: var(--fg)" d="M44 80 H 70"/>
  <path class="line" style="stroke: var(--ok)" d="M70 80 C 96 80, 100 44, 124 44"/>
  <circle cx="128" cy="44" r="15" style="fill: var(--ok)"/>
  <circle cx="32" cy="80" r="15" style="fill: var(--fg)"/>
