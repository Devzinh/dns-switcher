<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Roadmap: Fastest DNS com IA — API key própria, pesquisa web, geolocalização, sonda multi-amostra e ranking explicado">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0716"/><stop offset="1" stop-color="#111528"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" x2="1">
      <stop offset="0" stop-color="#f0abfc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="radar" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".25"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".55"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, monospace; }
      .sweep { transform-origin: 970px 245px; animation: spin 4s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .blip { opacity: 0; animation: blip 4s ease-out infinite; }
      .k1 { animation-delay: .4s } .k2 { animation-delay: 1.5s } .k3 { animation-delay: 2.6s } .k4 { animation-delay: 3.3s }
      @keyframes blip { 0% { opacity: 0 } 5% { opacity: 1 } 60% { opacity: .2 } 100% { opacity: 0 } }
      .step { opacity: .35; animation: step 7.5s ease-in-out infinite; }
      .s1 { animation-delay: 0s } .s2 { animation-delay: 1.5s } .s3 { animation-delay: 3s } .s4 { animation-delay: 4.5s } .s5 { animation-delay: 6s }
      @keyframes step { 0%,22%,100% { opacity: .35 } 4%,18% { opacity: 1 } }
      .bar { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28 } }
      .badge { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .55 } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>

  <g class="t">
    <rect class="badge" x="40" y="30" width="118" height="26" rx="13" fill="#2a1a40" stroke="#a78bfa"/>
    <text x="99" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#e9d5ff">EM BREVE</text>
    <text x="40" y="96" font-size="30" font-weight="800" fill="url(#ai)">Fastest DNS com IA</text>
    <text x="40" y="124" font-size="14" fill="#94a3b8">Traga sua API key. O app pesquisa, geolocaliza, mede e explica — em vez de só cronometrar uma lista fixa.</text>
  </g>

  <!-- pipeline (left) -->
  <path class="bar" d="M64 170 V 380" stroke="#a78bfa" stroke-width="2" fill="none"/>
  <g class="t">
    <g class="step s1">
      <circle cx="64" cy="170" r="13" fill="#1a1230" stroke="#f0abfc" stroke-width="2"/><text x="64" y="175" text-anchor="middle" font-size="13" fill="#f0abfc" font-weight="700">1</text>
      <text x="92" y="166" font-size="16" font-weight="700" fill="#f5f3ff">🔑 Sua API key, local</text>
      <text x="92" y="186" font-size="12.5" fill="#94a3b8">Guardada no Windows Credential Manager. Nada passa por servidor nosso.</text>
    </g>
    <g class="step s2">
      <circle cx="64" cy="222" r="13" fill="#1a1230" stroke="#c4b5fd" stroke-width="2"/><text x="64" y="227" text-anchor="middle" font-size="13" fill="#c4b5fd" font-weight="700">2</text>
      <text x="92" y="218" font-size="16" font-weight="700" fill="#f5f3ff">🌐 Pesquisa web do ano atual</text>
      <text x="92" y="238" font-size="12.5" fill="#94a3b8">Descobre resolvedores novos, IPs que mudaram e serviços descontinuados.</text>
    </g>
    <g class="step s3">
      <circle cx="64" cy="274" r="13" fill="#1a1230" stroke="#a78bfa" stroke-width="2"/><text x="64" y="279" text-anchor="middle" font-size="13" fill="#a78bfa" font-weight="700">3</text>
      <text x="92" y="270" font-size="16" font-weight="700" fill="#f5f3ff">📍 Geolocalização + ASN + PoP anycast</text>
      <text x="92" y="290" font-size="12.5" fill="#94a3b8">Seu IP público/ISP vs. o PoP que realmente responde (CHAOS id.server, EDNS-ECS).</text>
    </g>
    <g class="step s4">
      <circle cx="64" cy="326" r="13" fill="#1a1230" stroke="#818cf8" stroke-width="2"/><text x="64" y="331" text-anchor="middle" font-size="13" fill="#818cf8" font-weight="700">4</text>
      <text x="92" y="322" font-size="16" font-weight="700" fill="#f5f3ff">📡 Sonda multi-amostra</text>
      <text x="92" y="342" font-size="12.5" fill="#94a3b8">p50/p95, jitter, perda, cache hit vs. miss, Do53 · DoT · DoH, DNSSEC.</text>
    </g>
    <g class="step s5">
      <circle cx="64" cy="378" r="13" fill="#1a1230" stroke="#38bdf8" stroke-width="2"/><text x="64" y="383" text-anchor="middle" font-size="13" fill="#38bdf8" font-weight="700">5</text>
      <text x="92" y="374" font-size="16" font-weight="700" fill="#f5f3ff">🧠 Ranking explicado</text>
      <text x="92" y="394" font-size="12.5" fill="#94a3b8">"Este DNS vai ajudar SUA conexão?" — score com o porquê, não só o número.</text>
    </g>
  </g>

  <!-- radar (right) -->
  <circle cx="970" cy="245" r="150" fill="url(#radar)"/>
  <g fill="none" stroke="#2e2650">
    <circle cx="970" cy="245" r="50"/><circle cx="970" cy="245" r="100"/><circle cx="970" cy="245" r="150"/>
    <path d="M820 245 H1120 M970 95 V395"/>
  </g>
  <path class="sweep" d="M970 245 L1120 245 A150 150 0 0 0 1076 139 Z" fill="url(#sweep)"/>
  <g class="m" font-size="11">
    <g class="blip k1"><circle cx="1040" cy="190" r="6" fill="#5eead4"/><text x="1052" y="186" fill="#99f6e4">GRU · 6ms</text></g>
    <g class="blip k2"><circle cx="900" cy="310" r="6" fill="#fbbf24"/><text x="830" y="334" fill="#fde68a">MIA · 118ms</text></g>
    <g class="blip k3"><circle cx="905" cy="175" r="6" fill="#5eead4"/><text x="840" y="162" fill="#99f6e4">GIG · 11ms</text></g>
    <g class="blip k4"><circle cx="1060" cy="320" r="6" fill="#f87171"/><text x="1000" y="350" fill="#fecaca">FRA · 212ms</text></g>
  </g>
  <circle cx="970" cy="245" r="7" fill="#f5f3ff"/>
  <text class="t" x="970" y="272" text-anchor="middle" font-size="11" fill="#c4b5fd">você</text>
</svg>
