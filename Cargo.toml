[package]
name = "dns_switcher"
version = "0.1.2"
edition = "2021"
description = "Switch Windows DNS in one click, with a built-in fastest-resolver test."
license = "MIT"
readme = "README.md"
keywords = ["dns", "windows", "network", "egui", "resolver"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "dns_switcher"
path = "src/main.rs"
# The binary has no unit tests of its own; they live in the library.
test = false

[dependencies]
eframe = { version = "0.28", default-features = true }
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
raw-window-handle = "0.6"
# self-update: HTTPS client, signature check, hashing, GitHub API JSON
ureq = "3"
ed25519-dalek = "2"
sha2 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
tray-icon = "0.26"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
resvg = "0.45"

getrandom = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
